<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мой Чайный Дневник</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Подключаем парсер Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header>
    <h1>Мой Чайный Дневник</h1>
    <p>Личные заметки о дегустациях</p>
    <hr style="border-color: #333; margin-bottom: 2rem;">
  </header>

  <main id="reviews-container">
    <p>Загрузка рецензий...</p>
  </main>

  <script>
    // ВАЖНО: Замените на ваш логин и репозиторий
    const GITHUB_USER = "nikitacherem4532";
    const GITHUB_REPO = "Tea-Master-Story"; 
    const FOLDER = "content";

    async function loadReviews() {
      const container = document.getElementById('reviews-container');
      try {
        // Получаем список файлов из папки
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER}`);
        
        if (!response.ok) throw new Error('Ошибка ' + response.status + '. Проверьте путь к папке.');
        
        const files = await response.json();
        container.innerHTML = ''; // Очищаем "Загрузка..."

        // Проходимся по каждому файлу
        for (const file of files.reverse()) { // reverse() чтобы новые были сверху
          if (file.name.endsWith('.md')) {
            // Скачиваем содержимое файла
            const fileRes = await fetch(file.download_url);
            const text = await fileRes.text();

            // Парсим YAML-заголовок (между ---) и сам текст
            const parts = text.split('---');
            const frontmatter = parts[1];
            const body = parts.slice(2).join('---');

            // Достаём данные
            const title = frontmatter.match(/title:\s*(.*)/)?.[1]?.replace(/"/g, '') || 'Без названия';
            const date = frontmatter.match(/date:\s*(.*)/)?.[1] || '';
            const category = frontmatter.match(/category:\s*(.*)/)?.[1]?.replace(/"/g, '') || '';
            const rating = frontmatter.match(/rating:\s*(.*)/)?.[1]?.replace(/"/g, '') || '';

            // Превращаем Markdown в HTML
            const htmlBody = marked.parse(body);

            // Создаём карточку
            const card = document.createElement('article');
            card.className = 'review-card';
            card.innerHTML = `
              <h2>${title}</h2>
              <div class="review-meta">
                <span>${new Date(date).toLocaleDateString('ru-RU')}</span>
                <span class="badge">${category}</span>
                <span class="rating">${rating}</span>
              </div>
              <div class="content">${htmlBody}</div>
            `;
            container.appendChild(card);
          }
        }
      } catch (error) {
        container.innerHTML = `<p style="color: #ff5555;">Ошибка загрузки: ${error.message}</p>`;
        console.error(error);
      }
    }

    loadReviews();
  </script>
</body>
</html>
