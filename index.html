<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мой Чайный Дневник</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Подключаем парсер Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header>
    <h1>Мой Чайный Дневник</h1>
    <p>Личные заметки о дегустациях</p>
    <hr style="border-color: #333; margin-bottom: 2rem;">
  </header>

  <main id="reviews-container">
    <p>Загрузка рецензий...</p>
  </main>

   <script>
    const GITHUB_USER = "nikitacherem4532";
    const GITHUB_REPO = "Tea-Master-Story"; 
    const FOLDER = "content";

    async function loadReviews() {
      const container = document.getElementById('reviews-container');
      try {
        // Используем jsDelivr для обхода лимитов GitHub API
        const apiUrl = `https://data.jsdelivr.com/v1/packages/gh/${GITHUB_USER}/${GITHUB_REPO}@main`;
        const response = await fetch(apiUrl);
        
        if (!response.ok) throw new Error('Ошибка ' + response.status);
        
        const data = await response.json();
        
        // Ищем папку content
        const contentDir = data.files.find(f => f.name === FOLDER);
        if (!contentDir || !contentDir.files) {
          throw new Error('Папка ' + FOLDER + ' пуста или не найдена');
        }

        // Фильтруем только файлы .md
        const files = contentDir.files.filter(f => f.name.endsWith('.md'));
        container.innerHTML = '';

        // Проходимся по файлам в обратном порядке (новые сверху)
        for (const file of files.reverse()) {
          // Скачиваем сам текст рецензии через jsDelivr CDN
          const fileRes = await fetch(`https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${GITHUB_REPO}@main/${FOLDER}/${file.name}`);
          const text = await fileRes.text();

          // Парсим YAML-заголовок
          const parts = text.split('---');
          const frontmatter = parts[1];
          const body = parts.slice(2).join('---');

          const title = frontmatter.match(/title:\s*(.*)/)?.[1]?.replace(/"/g, '') || 'Без названия';
          const date = frontmatter.match(/date:\s*(.*)/)?.[1] || '';
          const category = frontmatter.match(/category:\s*(.*)/)?.[1]?.replace(/"/g, '') || '';
          const rating = frontmatter.match(/rating:\s*(.*)/)?.[1]?.replace(/"/g, '') || '';

          const htmlBody = marked.parse(body);

          const card = document.createElement('article');
          card.className = 'review-card';
          card.innerHTML = `
            <h2>${title}</h2>
            <div class="review-meta">
              <span>${new Date(date).toLocaleDateString('ru-RU')}</span>
              <span class="badge">${category}</span>
              <span class="rating">${rating}</span>
            </div>
            <div class="content">${htmlBody}</div>
          `;
          container.appendChild(card);
        }
      } catch (error) {
        container.innerHTML = `<p style="color: #ff5555;">Ошибка загрузки: ${error.message}</p>`;
        console.error(error);
      }
    }

    loadReviews();
  </script>
</body>
</html>
