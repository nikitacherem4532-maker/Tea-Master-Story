backend:
  name: github
  repo: nikitacherem4532/Tea-Master-Story
  branch: main # Если на GitHub у тебя ветка master, поменяй тут на master!
  base_url: https://my-tea-diary-proxy.nikitacherem4532.workers.dev
  auth_endpoint: auth # Убрал слэш, иногда это критично

collections:
  - name: "reviews"
    label: "Мои рецензии"
    folder: "content"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Название чая", name: "title", widget: "string"}
      - {label: "Дата дегустации", name: "date", widget: "datetime"}
      - {label: "Тип чая", name: "category", widget: "select", options: ["Шу Пуэр", "Шэн Пуэр", "Улун", "Красный", "Зелёный", "Белый", "Жёлтый", "Другой"]}
      - {label: "Оценка", name: "rating", widget: "select", options: ["🙂 по нраву", "😐 просто вкусный", "🙁 не зачёл"]}
      - {label: "Текст рецензии", name: "body", widget: "markdown"}
